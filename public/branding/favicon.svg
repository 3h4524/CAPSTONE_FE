<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="podivoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#podivoGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" ry="110" fill="none" stroke="url(#glowGrad)" stroke-width="4"/>

  <!-- Main Symbol Group -->
  <g filter="url(#subtleShadow)">
    <!-- Stem of P -->
    <rect x="156" y="128" width="40" height="216" rx="16" fill="#FFFFFF"/>

    <!-- P Loop Outer and Inner -->
    <path d="M 180 128 
             L 280 128 
             C 340 128, 380 162, 380 216 
             C 380 270, 340 304, 280 304 
             L 180 304 
             Z" 
          fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linejoin="round"/>

    <!-- AI Sparkle in the P Loop -->
    <!-- Center of loop is around (276, 216) -->
    <path d="M 276 182 
             C 276 202, 286 216, 306 216 
             C 286 216, 276 230, 276 250 
             C 276 230, 266 216, 246 216 
             C 266 216, 276 202, 276 182 Z" 
          fill="#FFFFFF"/>

    <!-- Dynamic Print-on-Demand Layer / Chevron under the loop -->
    <path d="M 226 348 
             L 276 376 
             L 366 324" 
          fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
          
    <path d="M 226 394 
             L 276 422 
             L 366 370" 
          fill="none" stroke="#C4B5FD" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
