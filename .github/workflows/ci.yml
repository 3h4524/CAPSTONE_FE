name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: dependency audit / trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      SECURITY_AUDIT_REPORT: /tmp/security-audit.md
      SECURITY_TRIVY_REPORT: /tmp/security-trivy.md
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0

      - name: Audit production packages
        id: audit
        continue-on-error: true
        run: |
          status=0
          GITHUB_STEP_SUMMARY="$SECURITY_AUDIT_REPORT" ./deploy/security-audit.sh audit pnpm:. || status=$?
          cat "$SECURITY_AUDIT_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install Trivy
        run: |
          curl --proto "=https" --tlsv1.2 -fsSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan the repository for vulnerabilities and secrets
        id: trivy
        continue-on-error: true
        run: |
          ./deploy/security-audit.sh trivyignore > /tmp/trivyignore
          status=0
          trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /tmp/trivyignore --format table --output /tmp/trivy-fs.txt . || status=$?
          { echo "## Trivy: repository"; echo '```'; cat /tmp/trivy-fs.txt; echo '```'; } > "$SECURITY_TRIVY_REPORT"
          cat "$SECURITY_TRIVY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: ./deploy/security-pr-comment.sh

      - name: Fail on findings
        if: steps.audit.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: |
          echo "::error::High or critical findings. Upgrade the package, or add an entry with a reason and an expiry date to security-acceptances.json."
          exit 1

  sonar:
    name: Sonar check for pull requests
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'merge-version-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      WIF_PROVIDER: projects/1035893227434/locations/global/workloadIdentityPools/github/providers/github-actions
      DEPLOYER_SA: apcs-deployer@apcs-prod.iam.gserviceaccount.com
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Load build settings
        run: grep -vE '^\s*(#|$)' deploy/fe.build.env >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Read the Sonar token
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        with:
          secrets: token:${{ env.GCP_PROJECT }}/sonar-token

      - name: Analyze
        if: env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ steps.secrets.outputs.token }}
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: Check security findings in new code
        if: env.SONAR_PROJECT_KEY != ''
        env:
          SONAR_TOKEN: ${{ steps.secrets.outputs.token }}
        run: ./deploy/sonar-security-gate.sh .scannerwork/report-task.txt

      - name: Comment on the pull request
        id: sonar_comment
        if: always() && env.SONAR_PROJECT_KEY != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_TOKEN: ${{ steps.secrets.outputs.token }}
        run: ./deploy/sonar-pr-comment.sh

      - name: Fail on any Sonar finding
        if: steps.sonar_comment.outputs.findings != '0'
        env:
          FINDINGS: ${{ steps.sonar_comment.outputs.findings }}
        run: |
          echo "::error::Sonar found $FINDINGS new issue(s) or hotspot(s) on this pull request."
          exit 1
