name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: dependency audit / trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      AUDIT_REPORT: /tmp/security-audit.md
      TRIVY_REPORT: /tmp/security-trivy.md
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0

      - name: Audit production packages
        id: audit
        continue-on-error: true
        run: |
          status=0
          GITHUB_STEP_SUMMARY="$AUDIT_REPORT" ./deploy/security-audit.sh audit pnpm:. || status=$?
          cat "$AUDIT_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install Trivy
        run: |
          curl --proto "=https" --tlsv1.2 -fsSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan the repository for vulnerabilities and secrets
        id: trivy
        continue-on-error: true
        run: |
          ./deploy/security-audit.sh trivyignore > /tmp/trivyignore
          status=0
          trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /tmp/trivyignore --format table --output /tmp/trivy-fs.txt . || status=$?
          { echo "## Trivy: repository"; echo '```'; cat /tmp/trivy-fs.txt; echo '```'; } > "$TRIVY_REPORT"
          cat "$TRIVY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: ./deploy/security-pr-comment.sh

      - name: Fail on findings
        if: steps.audit.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: |
          echo "::error::High or critical findings. Upgrade the package, or add an entry with a reason and an expiry date to security-acceptances.json."
          exit 1
