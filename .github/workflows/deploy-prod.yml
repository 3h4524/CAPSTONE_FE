name: Deploy production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to redeploy (the image must already exist)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  guard:
    name: Tag is on the production branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the tagged commit belongs to production
        run: |
          git fetch --no-tags origin production
          if ! git merge-base --is-ancestor HEAD origin/production; then
            echo "::error::$RELEASE_TAG is not on the production branch. Merge into production first, then tag."
            exit 1
          fi

  image:
    name: Quality gates and image
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install, lint, typecheck, test
        run: |
          pnpm install --frozen-lockfile
          pnpm exec eslint . --max-warnings=0
          pnpm exec tsc --noEmit
          pnpm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            GOOGLE_ANALYTICS_MEASUREMENT_ID=${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/apcs-fe:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/apcs-fe:latest-prod
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  deploy:
    name: Deploy to the VM
    needs: [guard, image]
    if: always() && needs.guard.result == 'success' && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.image.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          user: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: Roll out the frontend
        run: ssh apcs "/opt/apcs/deploy/scripts/deploy.sh fe $RELEASE_TAG"

      - name: Smoke test
        run: curl -fsS -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.APP_DOMAIN }}/"
